name: Build and Package

on:
 push:
  branches:
    - dev-new

env:
  NODE_VERSION: 22

jobs:
  release:
    runs-on: windows-latest
    
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'Beaver-Notes/Beaver-Notes'
          ref: Tauri
          fetch-depth: 1

      - name: Fix tauri
        shell: bash
        run: |
          jq '.bundle.windows.signCommand = "ossign.exe -t pecoff -o %1 %1 || true"' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - uses: ossign/ossign@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          installOnly: true
      
      
      # package.json is the source of truth for the release version.
      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          ossign.exe --help
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      
      - name: Setup Node with Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      # Use same yarn version everywhere
      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn --version

      # Install the Rust targets needed for each matrix job
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

        
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install JS dependencies
        shell: bash
        run: |
          yarn install --frozen-lockfile

      - name: Build Windows bundles
        shell: bash
        env:
          CI: 'true'
          OSSIGN_CONFIG_BASE64: ${{ secrets.OSSIGN_CONFIG_BASE64 }}
        run: |
          yarn tauri build --target "x86_64-pc-windows-msvc" --bundles nsis --ci || true
      
      - name: Stage Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Version = "${{ steps.version.outputs.version }}"
          $Target = "x86_64-pc-windows-msvc"
          $OutDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null

          Get-ChildItem "src-tauri/target/$Target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi", ".sig", ".json", ".zip" } |
            ForEach-Object { Copy-Item $_.FullName -Destination $OutDir -Force }

          $Binary = "src-tauri/target/$Target/release/beaver-notes.exe"
          $PortableName = "Beaver Notes-$Version-portable-windows-x64.zip"
          Compress-Archive -Path $Binary -DestinationPath (Join-Path $OutDir $PortableName) -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: Release ${{ github.run_id }}
          tag_name: ${{ github.run_id }}-TAURI
          body: |
            # Signed Release
            
            These are the distributable files for the signed release of Beaver-Notes

            The source code was fetched from https://github.com/Beaver-Notes/Beaver-Notes@Tauri
            
          



# Windows is build
