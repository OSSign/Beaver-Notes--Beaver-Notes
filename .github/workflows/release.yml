name: Build and Package

on:
  push:
    branches:
      - ossign

jobs:
  release:
    runs-on: win2k25-xl
    permissions: write-all
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: build Vite bundles
        run: yarn build

      - name: Build and conditionally publish Electron app
        shell: bash
        env:
          AST_VAULT: ${{ secrets.AST_VAULT }}
          AST_CERT: ${{ secrets.AST_CERT }}
          AST_IDENT: ${{ secrets.AST_IDENT }}
          AST_SECRET: ${{ secrets.AST_SECRET }}
          AST_TENANT: ${{ secrets.AST_TENANT }}
          AST_TIMESTAMP: ${{ secrets.AST_TIMESTAMP }}
          AST_TD: ${{ secrets.AST_TD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISH_FLAG="--publish always"
          yarn electron-builder build --config electron-builder.config.cjs --win $PUBLISH_FLAG
